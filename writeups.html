<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    })();

</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html"><span class="prompt">$</span> yuval elbar</a>
      <div class="nav-links">
        <a href="index.html">home</a>
        <a href="writeups.html" class="active">writeups</a>
        <a href="about.html">about</a>
        <a data-link="github" href="#" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub" style="padding:6px 8px;">gh</a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme"></button>
      </div>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <div class="sec-head">
        <h2><span class="prompt">$</span> grep -r vuln ~/writeups</h2>
      </div>

      <div class="filter-bar">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>

        </label>
        <div class="filters">
          <button class="filter-btn active" data-sev="all">all</button>
          <button class="filter-btn" data-sev="critical">critical</button>
          <button class="filter-btn" data-sev="high">high</button>
          <button class="filter-btn" data-sev="medium">medium</button>
        </div>
      </div>

      <div id="all-posts" class="post-list">
        <div class="loading">// loading writeups…</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>© <span id="year"></span> Yuval Elbar</span>
      <div class="footer-links">
